name: tradelens

services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: tradelens
      POSTGRES_USER: tradelens
      POSTGRES_PASSWORD: tradelens
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradelens -d tradelens"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/tradelens
      DB_USER: tradelens
      DB_PASSWORD: tradelens
      AI_MODE: ${AI_MODE:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      DEMO_SCENARIO_DATE: ${DEMO_SCENARIO_DATE:-2026-11-05}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 5s
      timeout: 5s
      retries: 30

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
