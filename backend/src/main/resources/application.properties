spring.application.name=tradelens

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tradelens}
spring.datasource.username=${DB_USER:tradelens}
spring.datasource.password=${DB_PASSWORD:tradelens}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# demo | live
app.ai.mode=${AI_MODE:demo}
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=${OPENAI_MODEL:}
app.ai.openai.timeout=30s
app.scenario.date=${DEMO_SCENARIO_DATE:2026-11-05}
